[package]
name = "dbc-swap"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dbc_swap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build","anchor-spl/idl-build"]


[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = "0.31.0"
dbc = { path = "../../libs/dbc" }
damm-v2 = { path = "../../libs/damm-v2" }

# Exact pins for Solana toolchain (rustc 1.79). Do not relax: blake3 1.8.3+ needs edition2024; indexmap 2.13+ needs rustc 1.82.
blake3 = "=1.8.2"
indexmap = "=2.11.4"