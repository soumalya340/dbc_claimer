[workspace]
members = [
    "programs/*",
    "libs/damm-v2",
    "libs/dbc"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Dependency policy for Solana toolchain (rustc 1.79): program Cargo.toml uses exact pins (blake3 =1.8.2, indexmap =2.11.4). Do not relax — see programs/dbc-swap/Cargo.toml.
